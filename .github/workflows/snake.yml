name: Contribution snake

on:
  schedule:
    - cron: '0 3 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0f766e&color_dots=#ebedf0,#b4e4dc,#5fc7b5,#1fa58f,#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#5eead4&color_dots=#161b22,#0e3b38,#11665d,#1fa58f,#5eead4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
